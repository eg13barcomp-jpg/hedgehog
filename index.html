<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ёжик-миллионер 🦔</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1e2b;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }
    #app {
      width: 100%;
      max-width: 500px;
      background: #252a36;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .screen { display: block; }
    .hidden { display: none !important; }

    h1, h2, h3 { color: #ffd966; text-align: center; margin-bottom: 10px; }
    .btn {
      background: #3b4252;
      border: none;
      color: #eee;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      margin: 5px;
    }
    .btn:hover { background: #4c5568; }
    .btn:active { transform: scale(0.96); }
    .btn.primary { background: #ffb347; color: #1a1e2b; font-weight: bold; }
    .btn.primary:hover { background: #ffa01c; }
    .btn.danger { background: #d94f4f; }
    .btn.danger:hover { background: #c03939; }

    .input-group {
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    input {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #3b4252;
      background: #1e222d;
      color: #eee;
      font-size: 1rem;
      outline: none;
    }
    .flex-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .balance { font-size: 1.5rem; font-weight: bold; color: #f0c674; }
    .nickname { color: #b48ead; }
    .creator .nickname { color: gold !important; font-weight: bold; }

    .shelves {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: #1e222d;
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 15px;
    }
    .shelf-slot {
      aspect-ratio: 1;
      background: #2e3440;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 2rem;
      transition: 0.1s;
      border: 2px solid transparent;
    }
    .shelf-slot.occupied { border-color: #5e81ac; background: #3b4252; }
    .shelf-slot:hover { background: #434c5e; }

    .warehouse {
      background: #1e222d;
      border-radius: 15px;
      padding: 10px;
      margin-bottom: 15px;
    }
    .warehouse-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
    }
    .warehouse-item {
      background: #2e3440;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 2px solid transparent;
      transition: 0.1s;
    }
    .warehouse-item:hover { border-color: #5e81ac; background: #3b4252; }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .shop-card {
      background: #1e222d;
      border-radius: 12px;
      padding: 8px;
      text-align: center;
      font-size: 0.9rem;
    }
    .shop-card .emoji { font-size: 1.8rem; }
    .boosters-panel {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .leaderboard { max-height: 70vh; overflow-y: auto; }
    .leaderboard-entry {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px solid #3b4252;
    }
    .leaderboard-entry.me { background: #2e3440; font-weight: bold; }
    .tab-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }

    .promo-area {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #252a36;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      gap: 5px;
      align-items: center;
      opacity: 0.8;
    }
    .promo-area input { width: 100px; }
  </style>
</head>
<body>
<div id="app">
  <!-- Стартовый экран -->
  <div id="start-screen" class="screen">
    <h1>Ёжик-миллионер 🦔</h1>
    <div class="flex-row">
      <button id="btn-register" class="btn primary">Регистрация</button>
      <button id="btn-login" class="btn">Вход</button>
    </div>
    <!-- Поля ввода (появляются при нажатии) -->
    <div id="auth-fields" class="hidden">
      <div class="input-group">
        <label>Никнейм</label>
        <input type="text" id="auth-nickname" placeholder="Твой ник">
      </div>
      <div class="input-group">
        <label>Пароль</label>
        <input type="password" id="auth-password" placeholder="Придумай пароль">
      </div>
      <button id="auth-submit" class="btn primary">Продолжить</button>
      <p id="auth-error" style="color: #d94f4f; margin-top: 5px;"></p>
    </div>
  </div>

  <!-- Игровой экран -->
  <div id="game-screen" class="screen hidden">
    <div class="top-bar">
      <div>
        <span class="nickname" id="player-nick"></span>
        <span id="creator-badge" style="color:gold; margin-left:5px;"></span>
      </div>
      <div class="balance" id="balance-display">0 ₽</div>
    </div>

    <h3>🧺 Полки</h3>
    <div class="shelves" id="shelves-container"></div>

    <h3>📦 Склад</h3>
    <div class="warehouse">
      <div class="warehouse-list" id="warehouse-container"></div>
    </div>

    <h3>🛒 Магазин</h3>
    <div class="shop-grid" id="shop-container"></div>

    <h3>✨ Бустеры</h3>
    <div class="boosters-panel" id="boosters-container"></div>

    <div class="flex-row" style="margin-top: 15px;">
      <button id="btn-logout" class="btn danger">🚪 Выйти</button>
    </div>
  </div>
</div>

<!-- Промокод -->
<div class="promo-area">
  <input type="text" id="promo-input" placeholder="Промокод">
  <button id="promo-apply" class="btn primary">OK</button>
</div>

<script>
  // ---------- ЗВУКИ ----------
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function playBeep(freq = 800, duration = 0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = 0.1;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // ---------- ТОВАРЫ ----------
  const shopItems = [
    { id: 'bread', name: 'Хлеб', emoji: '🍞', price: 0, income: 10 },
    { id: 'corn', name: 'Кукуруза', emoji: '🌽', price: 200, income: 20 },
    { id: 'chupa', name: 'Чупа-чупс', emoji: '🍭', price: 900, income: 30 },
    { id: 'marmelade', name: 'Мармелад', emoji: '🍬', price: 1100, income: 50 },
    { id: 'watermelon', name: 'Арбуз', emoji: '🍉', price: 2000, income: 140 },
    { id: 'chips', name: 'Чипсы', emoji: '🥔', price: 2800, income: 220 },
    { id: 'crackers', name: 'Сухарики', emoji: '🥨', price: 5000, income: 440 },
    { id: 'toy', name: 'Игрушка', emoji: '🧸', price: 6600, income: 600 },
    { id: 'clothes', name: 'Одежда', emoji: '👕', price: 10600, income: 1000 },
    { id: 'book', name: 'Книга', emoji: '📚', price: 18600, income: 1800 },
    { id: 'candybox', name: 'Коробка сладостей', emoji: '🎁', price: 24600, income: 2400 },
    { id: 'toaster', name: 'Тостер', emoji: '🔥', price: 38600, income: 3800 },
    { id: 'kettle', name: 'Чайник', emoji: '☕', price: 50600, income: 5000 },
    { id: 'yh', name: 'Ых', emoji: '🌀', price: 66666, income: 0.1 }
  ];

  const boosters = [
    { id: 'sale', name: '🔥 Особая акция', desc: 'x2 доход на 60 сек', price: 12000, type: 'temp', cooldown: 60 },
    { id: 'slot', name: '📢 Распродажа', desc: '+1 слот на полке', price: 8200, type: 'permanent', max: 1 },
    { id: 'discount', name: '🎯 Скидка 10%', desc: '+10% к доходу навсегда', price: 12000, type: 'permanent', max: 1 },
    { id: 'temp_contract', name: '📉 Врем. договор', desc: '-10% от баланса', price: 3000, type: 'temp', cooldown: 150 }
  ];

  // ---------- СОСТОЯНИЕ ИГРЫ ----------
  let gameState = {
    nickname: '',
    balance: 0,
    warehouse: [],
    shelves: [],
    maxShelves: 6,
    permanentBonus: 0,
    incomeMultiplier: 1,
    boostersPurchased: [],
    isCreator: false
  };

  let incomeInterval = null;
  let rentInterval = null;

  // ---------- ЛОКАЛЬНОЕ СОХРАНЕНИЕ ----------
  function saveToStorage() {
    localStorage.setItem('hedgehog_game', JSON.stringify(gameState));
  }

  function loadFromStorage() {
    const saved = localStorage.getItem('hedgehog_game');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        gameState = { ...gameState, ...parsed };
        // совместимость со старыми сохранениями
        if (!gameState.warehouse) gameState.warehouse = [];
        if (!gameState.shelves) gameState.shelves = new Array(gameState.maxShelves).fill(null);
        if (!gameState.boostersPurchased) gameState.boostersPurchased = [];
        while (gameState.shelves.length < gameState.maxShelves) gameState.shelves.push(null);
        if (gameState.shelves.length > gameState.maxShelves) gameState.shelves = gameState.shelves.slice(0, gameState.maxShelves);
        return true;
      } catch (e) {}
    }
    return false;
  }

  // ---------- ОТОБРАЖЕНИЕ ----------
  function renderShelves() {
    const container = document.getElementById('shelves-container');
    if (!container) return;
    container.innerHTML = '';
    for (let i = 0; i < gameState.maxShelves; i++) {
      const slot = document.createElement('div');
      slot.className = 'shelf-slot';
      const itemId = gameState.shelves[i];
      if (itemId) {
        const item = shopItems.find(it => it.id === itemId);
        slot.classList.add('occupied');
        slot.innerHTML = item ? item.emoji : '❓';
        slot.title = item ? item.name : '';
      } else {
        slot.innerHTML = '+';
      }
      slot.addEventListener('click', () => {
        if (itemId) {
          gameState.shelves[i] = null;
          gameState.warehouse.push(itemId);
          saveToStorage();
          renderAll();
          playBeep(400, 0.05);
        }
      });
      container.appendChild(slot);
    }
  }

  function renderWarehouse() {
    const container = document.getElementById('warehouse-container');
    if (!container) return;
    container.innerHTML = '';
    if (gameState.warehouse.length === 0) {
      container.innerHTML = '<span style="color:#888">Пусто</span>';
      return;
    }
    gameState.warehouse.forEach((itemId, index) => {
      const item = shopItems.find(it => it.id === itemId);
      const div = document.createElement('div');
      div.className = 'warehouse-item';
      div.innerHTML = `${item?.emoji || '📦'} ${item?.name || itemId}`;
      div.addEventListener('click', () => {
        const freeSlot = gameState.shelves.findIndex(s => s === null);
        if (freeSlot !== -1) {
          gameState.shelves[freeSlot] = itemId;
          gameState.warehouse.splice(index, 1);
          saveToStorage();
          renderAll();
          playBeep(600, 0.08);
        }
      });
      container.appendChild(div);
    });
  }

  function renderShop() {
    const container = document.getElementById('shop-container');
    if (!container) return;
    container.innerHTML = '';
    shopItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'shop-card';
      card.innerHTML = `
        <div class="emoji">${item.emoji}</div>
        <div><strong>${item.name}</strong></div>
        <div>💰 ${item.price} ₽</div>
        <div>📈 ${item.income} ₽/с</div>
        <button class="btn buy-btn" data-id="${item.id}">Купить</button>
      `;
      container.appendChild(card);
    });
    document.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.target.dataset.id;
        buyItem(id);
      });
    });
  }

  function renderBoosters() {
    const container = document.getElementById('boosters-container');
    if (!container) return;
    container.innerHTML = '';
    boosters.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = `${b.name} (${b.price}₽)`;
      btn.title = b.desc;
      btn.addEventListener('click', () => buyBooster(b.id));
      container.appendChild(btn);
    });
  }

  function updateBalanceDisplay() {
    const el = document.getElementById('balance-display');
    if (el) el.textContent = Math.floor(gameState.balance).toLocaleString() + ' ₽';
  }

  function renderAll() {
    renderShelves();
    renderWarehouse();
    renderShop();
    renderBoosters();
    updateBalanceDisplay();
    document.getElementById('player-nick').textContent = gameState.nickname;
    if (gameState.isCreator) {
      document.getElementById('creator-badge').textContent = '⭐';
    } else {
      document.getElementById('creator-badge').textContent = '';
    }
  }

  // ---------- ПОКУПКИ ----------
  function buyItem(itemId) {
    const item = shopItems.find(i => i.id === itemId);
    if (!item) return;
    if (gameState.balance < item.price) {
      playBeep(200, 0.15);
      return;
    }
    gameState.balance -= item.price;
    gameState.warehouse.push(itemId);
    saveToStorage();
    renderAll();
    playBeep(1000, 0.05);
  }

  function buyBooster(boosterId) {
    const booster = boosters.find(b => b.id === boosterId);
    if (!booster) return;
    if (gameState.balance < booster.price) {
      playBeep(200, 0.15);
      return;
    }
    if (booster.type === 'permanent' && gameState.boostersPurchased.includes(boosterId)) {
      playBeep(200, 0.15);
      return;
    }
    gameState.balance -= booster.price;
    if (booster.type === 'permanent') {
      gameState.boostersPurchased.push(boosterId);
      if (boosterId === 'slot') {
        if (gameState.maxShelves < 7) {
          gameState.maxShelves = 7;
          while (gameState.shelves.length < 7) gameState.shelves.push(null);
        }
      } else if (boosterId === 'discount') {
        gameState.permanentBonus += 0.1;
      }
    } else if (booster.type === 'temp') {
      if (boosterId === 'sale') {
        gameState.incomeMultiplier = 2;
        setTimeout(() => {
          gameState.incomeMultiplier = 1;
          saveToStorage();
        }, 60000);
      } else if (boosterId === 'temp_contract') {
        gameState.balance = Math.floor(gameState.balance * 0.9);
      }
    }
    saveToStorage();
    renderAll();
    playBeep(800, 0.1);
  }

  // ---------- ДОХОД / АРЕНДА ----------
  function calculateIncome() {
    let total = 0;
    gameState.shelves.forEach(itemId => {
      if (!itemId) return;
      const item = shopItems.find(i => i.id === itemId);
      if (item) total += item.income;
    });
    return total * (1 + gameState.permanentBonus) * gameState.incomeMultiplier;
  }

  function applyRent() {
    const rent = Math.floor(gameState.balance * 0.25);
    gameState.balance -= rent;
    if (gameState.balance < 0) gameState.balance = 0;
    saveToStorage();
    renderAll();
    playBeep(300, 0.1);
  }

  function startGameLoop() {
    if (incomeInterval) clearInterval(incomeInterval);
    if (rentInterval) clearInterval(rentInterval);
    incomeInterval = setInterval(() => {
      gameState.balance += calculateIncome();
      updateBalanceDisplay();
      saveToStorage();
    }, 1000);
    rentInterval = setInterval(() => {
      applyRent();
    }, 60000);
  }

  // ---------- АВТОРИЗАЦИЯ (локальная) ----------
  function showAuthFields(mode) {
    document.getElementById('auth-fields').classList.remove('hidden');
    document.getElementById('auth-error').textContent = '';
    document.getElementById('auth-nickname').value = '';
    document.getElementById('auth-password').value = '';
    // сохраняем режим
    document.getElementById('auth-fields').dataset.mode = mode;
  }

  document.getElementById('btn-register').addEventListener('click', () => {
    initAudio();
    showAuthFields('register');
  });
  document.getElementById('btn-login').addEventListener('click', () => {
    initAudio();
    showAuthFields('login');
  });

  document.getElementById('auth-submit').addEventListener('click', () => {
    initAudio();
    const nickname = document.getElementById('auth-nickname').value.trim();
    const password = document.getElementById('auth-password').value;
    const errorEl = document.getElementById('auth-error');
    if (!nickname || !password) {
      errorEl.textContent = 'Заполни все поля';
      return;
    }
    const mode = document.getElementById('auth-fields').dataset.mode;
    const storageKey = 'user_' + nickname;
    
    if (mode === 'register') {
      // проверяем, существует ли уже такой пользователь
      if (localStorage.getItem(storageKey) !== null) {
        errorEl.textContent = 'Этот никнейм уже занят';
        playBeep(200, 0.2);
        return;
      }
      // создаём нового игрока
      const userData = {
        password: password,
        gameState: {
          nickname: nickname,
          balance: 0,
          warehouse: ['bread'],
          shelves: new Array(6).fill(null),
          maxShelves: 6,
          permanentBonus: 0,
          incomeMultiplier: 1,
          boostersPurchased: [],
          isCreator: false
        }
      };
      localStorage.setItem(storageKey, JSON.stringify(userData));
      gameState = { ...userData.gameState };
      saveToStorage();
      // автовход
      localStorage.setItem('currentUser', nickname);
      enterGame();
      playBeep(660, 0.12);
    } else if (mode === 'login') {
      const userDataStr = localStorage.getItem(storageKey);
      if (!userDataStr) {
        errorEl.textContent = 'Пользователь не найден';
        playBeep(200, 0.2);
        return;
      }
      const userData = JSON.parse(userDataStr);
      if (userData.password !== password) {
        errorEl.textContent = 'Неверный пароль';
        playBeep(200, 0.2);
        return;
      }
      gameState = { ...userData.gameState };
      saveToStorage();
      localStorage.setItem('currentUser', nickname);
      enterGame();
      playBeep(660, 0.12);
    }
  });

  function enterGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    startGameLoop();
    renderAll();
  }

  // ---------- ВЫХОД ----------
  document.getElementById('btn-logout').addEventListener('click', () => {
    // сохраняем текущее состояние в профиль
    const currentUser = localStorage.getItem('currentUser');
    if (currentUser) {
      const storageKey = 'user_' + currentUser;
      const userDataStr = localStorage.getItem(storageKey);
      if (userDataStr) {
        const userData = JSON.parse(userDataStr);
        userData.gameState = { ...gameState };
        localStorage.setItem(storageKey, JSON.stringify(userData));
      }
    }
    if (incomeInterval) clearInterval(incomeInterval);
    if (rentInterval) clearInterval(rentInterval);
    localStorage.removeItem('currentUser');
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
    document.getElementById('auth-fields').classList.add('hidden');
    playBeep(400, 0.1);
  });

  // ---------- ПРОМОКОД ----------
  document.getElementById('promo-apply').addEventListener('click', () => {
    const code = document.getElementById('promo-input').value.trim();
    if (code === 'm9HYnMq1q42U') {
      gameState.isCreator = true;
      saveToStorage();
      renderAll();
      playBeep(880, 0.2);
      alert('Поздравляем! Вы стали создателем. Ваш ник теперь золотой.');
    } else {
      playBeep(200, 0.15);
    }
    document.getElementById('promo-input').value = '';
  });

  // ---------- ПРОВЕРКА АВТОВХОДА ----------
  window.addEventListener('DOMContentLoaded', () => {
    const currentUser = localStorage.getItem('currentUser');
    if (currentUser) {
      const storageKey = 'user_' + currentUser;
      const userDataStr = localStorage.getItem(storageKey);
      if (userDataStr) {
        const userData = JSON.parse(userDataStr);
        gameState = { ...userData.gameState };
        enterGame();
      }
    }
    // на всякий случай скроем поля
    document.getElementById('auth-fields').classList.add('hidden');
  });
</script>
</body>
</html>

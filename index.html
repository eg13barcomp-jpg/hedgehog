<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ёжик-миллионер 🦔</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e3a2f;
      background-image: radial-gradient(circle at 20% 30%, #2d5a3f 2%, transparent 2%),
                        radial-gradient(circle at 80% 70%, #2d5a3f 3%, transparent 3%),
                        radial-gradient(circle at 50% 50%, #1b4d2e 1%, transparent 1%);
      background-size: 60px 60px, 80px 80px, 100px 100px;
      color: #f0e6d3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      transition: background 0.8s, background-image 0.8s;
    }
    body.million {
      background: #1e3c2f;
      background-image: radial-gradient(circle at 20% 30%, #f9e076 2%, transparent 2%),
                        radial-gradient(circle at 80% 70%, #f9e076 3%, transparent 3%),
                        radial-gradient(circle at 50% 50%, #d4a017 1%, transparent 1%);
      background-size: 60px 60px, 80px 80px, 100px 100px;
    }
    #app {
      width: 100%;
      max-width: 550px;
      background: rgba(30, 46, 35, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 15px #5a8f4b;
      border: 2px solid #5a8f4b;
      position: relative;
      transition: background 0.5s, box-shadow 0.5s;
    }
    body.million #app {
      background: rgba(40, 55, 35, 0.9);
      box-shadow: 0 0 50px #f9e076, inset 0 0 25px #f9e076;
      border-color: #f9e076;
    }
    .screen { display: block; }
    .hidden { display: none !important; }

    h1, h2, h3 { color: #d4c09a; text-align: center; margin-bottom: 10px; text-shadow: 2px 2px 0 #2d3e1f; }
    body.million h1, body.million h2, body.million h3 { color: #ffd700; text-shadow: 0 0 10px #ffb800; }

    .btn {
      background: #4d6b4a;
      border: 2px solid #7faa6b;
      color: #f0e6d3;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      margin: 5px;
      font-weight: bold;
      text-shadow: 1px 1px 0 #2d3e1f;
      box-shadow: 0 4px 0 #2d3e1f;
    }
    .btn:hover { background: #5f8257; transform: translateY(-2px); box-shadow: 0 6px 0 #2d3e1f; }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2d3e1f; }
    .btn.primary { background: #d4a017; border-color: #f9e076; color: #1e3a2f; text-shadow: none; }
    .btn.success { background: #4caf50; border-color: #81c784; }
    .btn.danger { background: #b33f3f; border-color: #d97a7a; }
    .btn.warning { background: #b87c2c; border-color: #e6b566; }

    .input-group {
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    input {
      padding: 10px;
      border-radius: 15px;
      border: 2px solid #7faa6b;
      background: #1e3a2f;
      color: #f0e6d3;
      font-size: 1rem;
      outline: none;
      text-align: center;
    }
    .flex-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: center; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .balance { font-size: 1.5rem; font-weight: bold; color: #f9e076; text-shadow: 0 0 8px #b87c2c; }
    .nickname { color: #b48ead; }
    .creator .nickname { color: gold !important; font-weight: bold; }
    .progress-container {
      background: #2d3e1f;
      border-radius: 20px;
      height: 20px;
      margin: 10px 0;
      overflow: hidden;
      border: 1px solid #7faa6b;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #8bc34a);
      transition: width 0.3s;
      border-radius: 20px;
    }
    body.million .progress-fill { background: linear-gradient(90deg, gold, #ffd700); }

    .shelves {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: #2d3e1f;
      padding: 10px;
      border-radius: 15px;
      border: 2px solid #5a8f4b;
      margin-bottom: 15px;
    }
    .shelf-slot {
      aspect-ratio: 1;
      background: #3d5a3a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 2rem;
      transition: 0.1s;
      border: 2px solid #5a8f4b;
      position: relative;
    }
    .shelf-slot.occupied { border-color: #f9e076; background: #4d6b4a; }
    .shelf-slot:hover { background: #5f8257; }

    .warehouse {
      background: #2d3e1f;
      border-radius: 15px;
      padding: 10px;
      border: 2px solid #5a8f4b;
      margin-bottom: 15px;
    }
    .warehouse-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
    }
    .warehouse-item {
      background: #3d5a3a;
      border-radius: 20px;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 2px solid #7faa6b;
      transition: 0.1s;
      font-size: 0.9rem;
    }
    .warehouse-item:hover { border-color: #f9e076; background: #4d6b4a; }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .shop-card {
      background: #2d3e1f;
      border-radius: 20px;
      padding: 8px;
      text-align: center;
      font-size: 0.85rem;
      border: 2px solid #5a8f4b;
      transition: 0.2s;
    }
    .shop-card .emoji { font-size: 1.8rem; }
    .boosters-panel {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .timer-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin: 5px 0;
      color: #c4b896;
    }
    .timer-row span { color: #f9e076; }
    .shop-panel, .minigame-panel {
      background: #2d3e1f;
      border-radius: 20px;
      padding: 15px;
      margin-top: 15px;
      border: 2px solid #5a8f4b;
    }
    .upgrade-card, .minigame-card {
      background: #3d5a3a;
      border-radius: 15px;
      padding: 10px;
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .minigame-grid {
      display: grid;
      gap: 2px;
      margin: 10px auto;
      background: #1e3a2f;
      padding: 5px;
      border-radius: 10px;
    }
    .minigame-cell {
      width: 30px;
      height: 30px;
      background: #3d5a3a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .minigame-cell .ball {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #ff6666, #cc0000);
      border-radius: 50%;
      box-shadow: 0 0 6px red;
    }

    .promo-area {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(30, 46, 35, 0.9);
      padding: 10px;
      border-radius: 20px;
      display: flex;
      gap: 5px;
      align-items: center;
      border: 2px solid #5a8f4b;
      z-index: 10;
    }
    .promo-area input { width: 100px; background: #1e3a2f; border-color: #7faa6b; }
  </style>
</head>
<body>
<div id="app">
  <!-- Стартовый экран -->
  <div id="start-screen" class="screen">
    <h1>🦔 Ёжик-миллионер</h1>
    <div class="flex-row">
      <button id="btn-register" class="btn primary">Регистрация</button>
      <button id="btn-login" class="btn">Вход</button>
    </div>
    <div id="auth-fields" class="hidden">
      <div class="input-group"><label>Никнейм</label><input type="text" id="auth-nickname" placeholder="Твой ник"></div>
      <div class="input-group"><label>Пароль</label><input type="password" id="auth-password" placeholder="Придумай пароль"></div>
      <button id="auth-submit" class="btn primary">Продолжить</button>
      <p id="auth-error" style="color: #d94f4f; margin-top: 5px;"></p>
    </div>
  </div>

  <!-- Игровой экран -->
  <div id="game-screen" class="screen hidden">
    <div class="top-bar">
      <div><span class="nickname" id="player-nick"></span><span id="creator-badge" style="color:gold; margin-left:5px;"></span></div>
      <div class="balance" id="balance-display">0 ₽</div>
    </div>
    <div class="progress-container"><div class="progress-fill" id="progress-fill" style="width:0;"></div></div>
    <div class="timer-row">
      <div>⏳ До аренды: <span id="rent-timer">60</span> сек</div>
      <div id="booster-timer" class="hidden">🔥 Акция: <span id="booster-left"></span> сек</div>
    </div>

    <h3>🧺 Полки <span style="font-size:0.8rem;">(<span id="shelf-count">6</span>)</span></h3>
    <div class="shelves" id="shelves-container"></div>

    <h3>📦 Склад</h3>
    <div class="warehouse"><div class="warehouse-list" id="warehouse-container"></div></div>

    <h3>🛒 Магазин</h3>
    <div class="shop-grid" id="shop-container"></div>

    <h3>✨ Бустеры</h3>
    <div class="boosters-panel" id="boosters-container"></div>

    <div class="flex-row" style="margin-top: 15px;">
      <button id="btn-minigames" class="btn">🎮 Мини-игры</button>
      <button id="btn-shop-view" class="btn warning">🏬 Вид магазина</button>
      <button id="btn-reset" class="btn danger">🔄 Сброс</button>
      <button id="btn-logout" class="btn">🚪 Выйти</button>
    </div>

    <!-- Панель улучшений магазина -->
    <div id="shop-upgrade-panel" class="shop-panel hidden">
      <h3>🏬 Улучшения магазина</h3>
      <div id="upgrades-list"></div>
      <button id="btn-close-shop" class="btn">Закрыть</button>
    </div>

    <!-- Панель мини-игр -->
    <div id="minigame-panel" class="minigame-panel hidden">
      <h3>🎮 Мини-игры</h3>
      <div id="minigame-list"></div>
      <button id="btn-close-minigames" class="btn">Закрыть</button>
    </div>

    <!-- Активная мини-игра -->
    <div id="active-minigame" class="minigame-panel hidden">
      <h3 id="minigame-title"></h3>
      <div id="minigame-content"></div>
      <div id="minigame-input-area" class="flex-row" style="margin-top:10px;"></div>
      <div id="minigame-timer" style="text-align:center; margin:5px; color:#f9e076;"></div>
      <button id="btn-minigame-submit" class="btn primary hidden">Ответить</button>
      <p id="minigame-feedback" style="text-align:center;"></p>
      <button id="btn-minigame-back" class="btn">Назад к списку</button>
    </div>
  </div>
</div>

<!-- Промокод -->
<div class="promo-area">
  <input type="text" id="promo-input" placeholder="Промокод">
  <button id="promo-apply" class="btn primary">OK</button>
</div>

<script>
  // ---------- ЗВУКИ ----------
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playBeep(freq = 800, duration = 0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.value = freq;
    gain.gain.value = 0.1; osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }

  // ---------- ТОВАРЫ ----------
  const shopItems = [
    { id: 'bread', name: 'Хлеб', emoji: '🍞', price: 0, income: 10, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'corn', name: 'Кукуруза', emoji: '🌽', price: 200, income: 20, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'chupa', name: 'Чупа-чупс', emoji: '🍭', price: 900, income: 30, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'marmelade', name: 'Мармелад', emoji: '🍬', price: 3850, income: 50, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'watermelon', name: 'Арбуз', emoji: '🍉', price: 7000, income: 140, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'chips', name: 'Чипсы', emoji: '🥔', price: 9800, income: 220, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'crackers', name: 'Сухарики', emoji: '🥨', price: 17500, income: 440, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'toy', name: 'Игрушка', emoji: '🧸', price: 23100, income: 600, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'clothes', name: 'Одежда', emoji: '👕', price: 37100, income: 1000, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'book', name: 'Книга', emoji: '📚', price: 65100, income: 1800, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'candybox', name: 'Коробка сладостей', emoji: '🎁', price: 86100, income: 2400, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'toaster', name: 'Тостер', emoji: '🔥', price: 135100, income: 3800, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'kettle', name: 'Чайник', emoji: '☕', price: 177100, income: 5000, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'yh', name: 'Ых', emoji: '🌀', price: 66666, income: 0.1, interval: 2, fixedInterval: false, unlocked: true },
    { id: 'car', name: 'Машина', emoji: '🚗', price: 1000000, income: 20000, interval: 2, fixedInterval: false, unlocked: false },
    { id: 'mine', name: 'Золотая шахта', emoji: '⛏️', price: 1500000, income: 100000, interval: 4, fixedInterval: true, unlocked: false },
    { id: 'oil', name: 'Нефтяная вышка', emoji: '🛢️', price: 3000000, income: 60000, interval: 1, fixedInterval: true, unlocked: false },
    { id: 'penthouse', name: 'Пентхаус', emoji: '🏙️', price: 10000000, income: 200000, interval: 1, fixedInterval: true, unlocked: false }
  ];

  const boosters = [
    { id: 'sale', name: '🔥 Особая акция', desc: 'Удваивает доход на 60 сек', price: 30000, type: 'temp', duration: 60 },
    { id: 'slot', name: '📢 Распродажа', desc: '+1 слот на полке (макс. 7)', price: 20500, type: 'permanent', max: 1 },
    { id: 'discount', name: '🎯 Скидка 10%', desc: '+10% к доходу навсегда', price: 30000, type: 'permanent', max: 1 }
  ];

  const shopUpgrades = [
    { level: 1, name: 'Повесить плакаты', cost: 100000, desc: 'Товары дают доход каждые 1.5 сек', effect: () => { updateBaseInterval(1.5); } },
    { level: 2, name: 'Расширить помещение', cost: 200000, desc: '+1 слот на полке', effect: () => { gameState.maxShelves += 1; while(gameState.shelves.length < gameState.maxShelves) gameState.shelves.push(null); } },
    { level: 3, name: 'Красивая вывеска', cost: 500000, desc: 'Товары дают доход каждую 1 сек', effect: () => { updateBaseInterval(1); } },
    { level: 4, name: 'Завезти новые товары', cost: 800000, desc: 'Открывает элитные товары', effect: () => { unlockEliteItems(); } }
  ];

  // ---------- МИНИ-ИГРЫ ----------
  const miniGames = [
    {
      id: 'arithmetic',
      name: '🔢 Арифметика',
      difficulties: [
        { name: 'Лёгкий', desc: 'Сложение/вычитание однозначных', reward: 1000, time: 10, questions: 5 },
        { name: 'Средний', desc: 'Умножение/деление', reward: 2100, time: 10, questions: 5 },
        { name: 'Сложный', desc: 'Трёхзначные +/-', reward: 5200, time: 10, questions: 5 }
      ],
      start: function(diff) { startArithmetic(diff); }
    },
    {
      id: 'countBalls',
      name: '🔴 Считалка',
      difficulties: [
        { name: 'Лёгкий', desc: 'Поле 6×6, шаров 10-30', reward: 1200, time: 10, grid: 6, min: 10, max: 30 },
        { name: 'Средний', desc: 'Поле 7×7, шаров 15-40', reward: 2600, time: 12, grid: 7, min: 15, max: 40 },
        { name: 'Сложный', desc: 'Поле 8×8, шаров 20-60', reward: 6000, time: 14, grid: 8, min: 20, max: 60 }
      ],
      start: function(diff) { startCountBalls(diff); }
    }
  ];

  // ---------- СОСТОЯНИЕ ----------
  let gameState = {
    nickname: '', balance: 0, warehouse: [], shelves: [], maxShelves: 6,
    permanentBonus: 0, incomeMultiplier: 1, boostersPurchased: [], isCreator: false,
    shopLevel: 0, baseInterval: 2, boosterEndTime: 0, shelvesTimers: []
  };

  let incomeInterval = null, rentInterval = null, secondTimer = null;
  let miniGameActive = false;

  // ---------- СОХРАНЕНИЯ ----------
  function saveToStorage() {
    const s = {...gameState}; delete s.shelvesTimers;
    localStorage.setItem('hedgehog_game', JSON.stringify(s));
  }
  function loadFromStorage() {
    const saved = localStorage.getItem('hedgehog_game');
    if (saved) {
      try {
        const p = JSON.parse(saved);
        gameState = {...gameState, ...p};
        if (!gameState.warehouse) gameState.warehouse = [];
        if (!gameState.shelves) gameState.shelves = new Array(gameState.maxShelves).fill(null);
        while (gameState.shelves.length < gameState.maxShelves) gameState.shelves.push(null);
        if (gameState.shelves.length > gameState.maxShelves) gameState.shelves = gameState.shelves.slice(0, gameState.maxShelves);
        updateBaseInterval(gameState.baseInterval);
        if (gameState.shopLevel >= 4) unlockEliteItems();
        initShelvesTimers();
        return true;
      } catch(e) {}
    }
    return false;
  }
  function initShelvesTimers() { gameState.shelvesTimers = gameState.shelves.map(() => Date.now()); }

  function updateBaseInterval(newInt) {
    gameState.baseInterval = newInt;
    shopItems.forEach(it => { if (!it.fixedInterval && it.unlocked) it.interval = newInt; });
  }
  function unlockEliteItems() {
    ['car','mine','oil','penthouse'].forEach(id => {
      const it = shopItems.find(i=>i.id===id); if(it) it.unlocked = true;
    });
  }

  // ---------- РЕНДЕР ----------
  function renderShelves() {
    const c = document.getElementById('shelves-container'); c.innerHTML = '';
    for (let i = 0; i < gameState.maxShelves; i++) {
      const slot = document.createElement('div'); slot.className = 'shelf-slot';
      const itemId = gameState.shelves[i];
      if (itemId) {
        const item = shopItems.find(it=>it.id===itemId);
        slot.classList.add('occupied');
        slot.innerHTML = item ? item.emoji : '❓';
        slot.title = item ? item.name : '';
      } else slot.innerHTML = '+';
      slot.addEventListener('click', () => {
        if (itemId) {
          gameState.shelves[i] = null; gameState.warehouse.push(itemId);
          saveToStorage(); renderAll(); playBeep(400, 0.05);
        }
      });
      c.appendChild(slot);
    }
    document.getElementById('shelf-count').textContent = gameState.maxShelves;
  }
  function renderWarehouse() {
    const c = document.getElementById('warehouse-container'); c.innerHTML = '';
    if (!gameState.warehouse.length) { c.innerHTML = '<span style="color:#888">Пусто</span>'; return; }
    gameState.warehouse.forEach((itemId, idx) => {
      const item = shopItems.find(it=>it.id===itemId);
      const d = document.createElement('div'); d.className = 'warehouse-item';
      d.innerHTML = `${item?.emoji||'📦'} ${item?.name||itemId}`;
      d.addEventListener('click', () => {
        const free = gameState.shelves.findIndex(s=>s===null);
        if (free !== -1) {
          gameState.shelves[free] = itemId; gameState.warehouse.splice(idx,1);
          gameState.shelvesTimers[free] = Date.now();
          saveToStorage(); renderAll(); playBeep(600, 0.08);
        }
      });
      c.appendChild(d);
    });
  }
  function renderShop() {
    const c = document.getElementById('shop-container'); c.innerHTML = '';
    shopItems.filter(it=>it.unlocked).forEach(item => {
      const card = document.createElement('div'); card.className = 'shop-card';
      const intText = item.fixedInterval ? ` (каждые ${item.interval}с)` : ` (каждые ${gameState.baseInterval}с)`;
      card.innerHTML = `<div class="emoji">${item.emoji}</div><div><strong>${item.name}</strong></div>
        <div>💰 ${item.price.toLocaleString()} ₽</div><div>📈 +${item.income} ₽${intText}</div>
        <button class="btn buy-btn" data-id="${item.id}">Купить</button>`;
      c.appendChild(card);
    });
    document.querySelectorAll('.buy-btn').forEach(b => b.addEventListener('click', e => buyItem(e.target.dataset.id)));
  }
  function renderBoosters() {
    const c = document.getElementById('boosters-container'); c.innerHTML = '';
    boosters.forEach(b => {
      const btn = document.createElement('button'); btn.className = 'btn';
      if (b.type==='permanent' && gameState.boostersPurchased.includes(b.id)) {
        btn.classList.add('success'); btn.textContent = `${b.name} ✅`;
      } else btn.textContent = `${b.name} (${b.price.toLocaleString()}₽)`;
      btn.title = b.desc;
      btn.addEventListener('click', () => buyBooster(b.id));
      c.appendChild(btn);
    });
  }
  function updateBalanceDisplay() {
    document.getElementById('balance-display').textContent = Math.floor(gameState.balance).toLocaleString()+' ₽';
    const pct = Math.min(100, (gameState.balance/1e6)*100);
    document.getElementById('progress-fill').style.width = pct+'%';
    document.body.classList.toggle('million', gameState.balance >= 1e6);
  }
  function renderAll() {
    renderShelves(); renderWarehouse(); renderShop(); renderBoosters(); updateBalanceDisplay();
    document.getElementById('player-nick').textContent = gameState.nickname;
    document.getElementById('creator-badge').textContent = gameState.isCreator ? '⭐' : '';
  }

  // ---------- ИГРОВОЙ ЦИКЛ ----------
  function startGameLoop() {
    if (incomeInterval) clearInterval(incomeInterval);
    if (rentInterval) clearInterval(rentInterval);
    if (secondTimer) clearInterval(secondTimer);
    incomeInterval = setInterval(() => {
      if (miniGameActive) return;
      const now = Date.now();
      for (let i=0; i<gameState.shelves.length; i++) {
        const itemId = gameState.shelves[i]; if (!itemId) continue;
        const item = shopItems.find(it=>it.id===itemId); if (!item) continue;
        if (now - gameState.shelvesTimers[i] >= item.interval*1000) {
          gameState.balance += item.income * (1+gameState.permanentBonus) * gameState.incomeMultiplier;
          gameState.shelvesTimers[i] = now;
        }
      }
      updateBalanceDisplay(); saveToStorage();
    }, 200);
    let rentLeft = 60;
    document.getElementById('rent-timer').textContent = rentLeft;
    secondTimer = setInterval(() => {
      if (miniGameActive) return;
      rentLeft--; document.getElementById('rent-timer').textContent = rentLeft;
      if (rentLeft <= 0) { applyRent(); rentLeft = 60; }
      if (gameState.boosterEndTime > 0) {
        const left = Math.max(0, Math.ceil((gameState.boosterEndTime - Date.now())/1000));
        document.getElementById('booster-left').textContent = left;
        if (left <= 0) {
          gameState.incomeMultiplier = 1; gameState.boosterEndTime = 0;
          document.getElementById('booster-timer').classList.add('hidden'); saveToStorage();
        } else document.getElementById('booster-timer').classList.remove('hidden');
      } else document.getElementById('booster-timer').classList.add('hidden');
    }, 1000);
  }
  function applyRent() {
    gameState.balance = Math.max(0, gameState.balance - Math.floor(gameState.balance*0.25));
    saveToStorage(); renderAll(); playBeep(300,0.1);
  }

  // ---------- ПОКУПКИ ----------
  function buyItem(itemId) {
    const item = shopItems.find(i=>i.id===itemId);
    if (!item || !item.unlocked || gameState.balance < item.price) { playBeep(200,0.15); return; }
    gameState.balance -= item.price; gameState.warehouse.push(itemId);
    saveToStorage(); renderAll(); playBeep(1000,0.05);
  }
  function buyBooster(boosterId) {
    const b = boosters.find(x=>x.id===boosterId);
    if (!b || gameState.balance < b.price) { playBeep(200,0.15); return; }
    if (b.type==='permanent' && gameState.boostersPurchased.includes(boosterId)) return;
    gameState.balance -= b.price;
    if (b.type==='permanent') {
      gameState.boostersPurchased.push(boosterId);
      if (boosterId==='slot') { gameState.maxShelves = Math.min(7, gameState.maxShelves+1); while(gameState.shelves.length<gameState.maxShelves) { gameState.shelves.push(null); gameState.shelvesTimers.push(Date.now()); } }
      else if (boosterId==='discount') gameState.permanentBonus += 0.1;
    } else if (boosterId==='sale') {
      gameState.incomeMultiplier = 2; gameState.boosterEndTime = Date.now() + b.duration*1000;
    }
    saveToStorage(); renderAll(); playBeep(800,0.1);
  }

  // ---------- УЛУЧШЕНИЯ МАГАЗИНА ----------
  function renderShopUpgrades() {
    const list = document.getElementById('upgrades-list'); list.innerHTML = '';
    shopUpgrades.forEach(upg => {
      const bought = gameState.shopLevel >= upg.level;
      const card = document.createElement('div'); card.className = 'upgrade-card';
      card.innerHTML = `<div><strong>${upg.name}</strong><br><small>${upg.desc}</small></div>
        <div>${bought ? '<span style="color:#4caf50;">✅</span>' : `<button class="btn primary buy-upgrade" data-level="${upg.level}">${upg.cost.toLocaleString()} ₽</button>`}</div>`;
      list.appendChild(card);
    });
    document.querySelectorAll('.buy-upgrade').forEach(b => b.addEventListener('click', e => buyUpgrade(+e.target.dataset.level)));
  }
  function buyUpgrade(level) {
    const upg = shopUpgrades.find(u=>u.level===level);
    if (!upg || gameState.shopLevel >= level || level !== gameState.shopLevel+1 || gameState.balance < upg.cost) { playBeep(200,0.15); return; }
    gameState.balance -= upg.cost; gameState.shopLevel = level; upg.effect();
    saveToStorage(); renderAll(); renderShopUpgrades(); playBeep(1000,0.1);
  }

  // ---------- МИНИ-ИГРЫ ----------
  function openMinigameList() {
    document.getElementById('minigame-panel').classList.remove('hidden');
    const list = document.getElementById('minigame-list'); list.innerHTML = '';
    miniGames.forEach(mg => {
      const card = document.createElement('div'); card.className = 'minigame-card';
      card.innerHTML = `<div><strong>${mg.name}</strong></div>`;
      const diffDiv = document.createElement('div');
      mg.difficulties.forEach((d, idx) => {
        const btn = document.createElement('button'); btn.className = 'btn primary';
        btn.textContent = `${d.name} (${d.reward}₽)`; btn.style.margin = '2px';
        btn.addEventListener('click', () => {
          document.getElementById('minigame-panel').classList.add('hidden');
          mg.start(d);
        });
        diffDiv.appendChild(btn);
      });
      card.appendChild(diffDiv);
      list.appendChild(card);
    });
  }

  // Арифметика
  let arithQuestions = [], arithIndex = 0, arithTimer = null, arithTimeLeft = 0;
  function startArithmetic(diff) {
    miniGameActive = true;
    document.getElementById('active-minigame').classList.remove('hidden');
    document.getElementById('minigame-title').textContent = `Арифметика (${diff.name})`;
    const content = document.getElementById('minigame-content');
    const inputArea = document.getElementById('minigame-input-area');
    const submitBtn = document.getElementById('btn-minigame-submit');
    const timerEl = document.getElementById('minigame-timer');
    const feedback = document.getElementById('minigame-feedback');
    content.innerHTML = ''; feedback.textContent = '';
    // генерация вопросов
    arithQuestions = [];
    for (let i=0; i<diff.questions; i++) {
      let a,b,op,answer;
      if (diff.name==='Лёгкий') {
        a = Math.floor(Math.random()*9)+1; b = Math.floor(Math.random()*9)+1;
        op = Math.random()<0.5 ? '+' : '-';
        if (op==='-') { if (a<b) [a,b]=[b,a]; answer = a-b; } else answer = a+b;
      } else if (diff.name==='Средний') {
        if (Math.random()<0.5) { // умножение
          a = Math.floor(Math.random()*9)+2; b = Math.floor(Math.random()*9)+2;
          op = '×'; answer = a*b;
        } else { // деление
          b = Math.floor(Math.random()*9)+2; answer = Math.floor(Math.random()*9)+2;
          a = b * answer; op = '÷';
        }
      } else {
        a = Math.floor(Math.random()*900)+100; b = Math.floor(Math.random()*900)+100;
        op = Math.random()<0.5 ? '+' : '-';
        if (op==='-') { if (a<b) [a,b]=[b,a]; answer = a-b; } else answer = a+b;
      }
      arithQuestions.push({ text: `${a} ${op} ${b} = ?`, answer });
    }
    arithIndex = 0; arithTimeLeft = diff.time;
    showArithQuestion();
    inputArea.innerHTML = '<input type="number" id="arith-answer" placeholder="Ответ">';
    submitBtn.classList.remove('hidden');
    timerEl.textContent = `Осталось: ${arithTimeLeft} сек`;
    arithTimer = setInterval(() => {
      arithTimeLeft--;
      timerEl.textContent = `Осталось: ${arithTimeLeft} сек`;
      if (arithTimeLeft <= 0) {
        clearInterval(arithTimer);
        endMinigame(false);
      }
    }, 1000);
    submitBtn.onclick = () => {
      const ans = parseInt(document.getElementById('arith-answer').value);
      if (isNaN(ans)) return;
      if (ans === arithQuestions[arithIndex].answer) {
        arithIndex++;
        if (arithIndex >= arithQuestions.length) {
          clearInterval(arithTimer);
          endMinigame(true, diff.reward);
        } else {
          showArithQuestion();
          document.getElementById('arith-answer').value = '';
          document.getElementById('arith-answer').focus();
        }
      } else {
        feedback.textContent = '❌ Неверно! Игра окончена.';
        clearInterval(arithTimer);
        endMinigame(false);
      }
    };
  }
  function showArithQuestion() {
    document.getElementById('minigame-content').innerHTML = `<h2>${arithQuestions[arithIndex].text}</h2>`;
  }

  // Считалка
  let countBallsGrid = [], countBallsAnswer = 0, countBallsTimer = null, countBallsTimeLeft = 0;
  function startCountBalls(diff) {
    miniGameActive = true;
    document.getElementById('active-minigame').classList.remove('hidden');
    document.getElementById('minigame-title').textContent = `Считалка (${diff.name})`;
    document.getElementById('minigame-content').innerHTML = '';
    const inputArea = document.getElementById('minigame-input-area');
    const submitBtn = document.getElementById('btn-minigame-submit');
    const timerEl = document.getElementById('minigame-timer');
    const feedback = document.getElementById('minigame-feedback');
    feedback.textContent = '';
    // генерация поля
    const grid = diff.grid;
    const totalCells = grid*grid;
    const ballCount = Math.floor(Math.random()*(diff.max-diff.min+1)) + diff.min;
    countBallsAnswer = ballCount;
    // создаём массив индексов и выбираем случайные
    const indices = Array.from({length: totalCells}, (_,i)=>i);
    for (let i=0; i<ballCount; i++) {
      const randIdx = Math.floor(Math.random()*indices.length);
      countBallsGrid.push(indices.splice(randIdx,1)[0]);
    }
    // рисуем сетку
    const gridContainer = document.createElement('div');
    gridContainer.className = 'minigame-grid';
    gridContainer.style.gridTemplateColumns = `repeat(${grid}, 32px)`;
    for (let i=0; i<totalCells; i++) {
      const cell = document.createElement('div'); cell.className = 'minigame-cell';
      if (countBallsGrid.includes(i)) {
        const ball = document.createElement('div'); ball.className = 'ball';
        cell.appendChild(ball);
      }
      gridContainer.appendChild(cell);
    }
    document.getElementById('minigame-content').appendChild(gridContainer);
    inputArea.innerHTML = '<input type="number" id="count-answer" placeholder="Сколько шаров?">';
    submitBtn.classList.remove('hidden');
    countBallsTimeLeft = diff.time;
    timerEl.textContent = `Осталось: ${countBallsTimeLeft} сек`;
    countBallsTimer = setInterval(() => {
      countBallsTimeLeft--;
      timerEl.textContent = `Осталось: ${countBallsTimeLeft} сек`;
      if (countBallsTimeLeft <= 0) {
        clearInterval(countBallsTimer);
        endMinigame(false);
      }
    }, 1000);
    submitBtn.onclick = () => {
      const ans = parseInt(document.getElementById('count-answer').value);
      if (isNaN(ans)) return;
      if (ans === countBallsAnswer) {
        clearInterval(countBallsTimer);
        endMinigame(true, diff.reward);
      } else {
        feedback.textContent = '❌ Неверно!';
        clearInterval(countBallsTimer);
        endMinigame(false);
      }
    };
  }

  function endMinigame(won, reward=0) {
    miniGameActive = false;
    if (arithTimer) clearInterval(arithTimer);
    if (countBallsTimer) clearInterval(countBallsTimer);
    document.getElementById('btn-minigame-submit').classList.add('hidden');
    if (won) {
      gameState.balance += reward;
      saveToStorage(); renderAll();
      playBeep(880,0.2);
      document.getElementById('minigame-feedback').textContent = `✅ Победа! +${reward} ₽`;
    } else {
      playBeep(200,0.2);
      if (!document.getElementById('minigame-feedback').textContent) document.getElementById('minigame-feedback').textContent = '⏰ Время вышло';
    }
    // кнопка назад уже есть
  }

  document.getElementById('btn-minigames').addEventListener('click', openMinigameList);
  document.getElementById('btn-close-minigames').addEventListener('click', ()=> document.getElementById('minigame-panel').classList.add('hidden'));
  document.getElementById('btn-minigame-back').addEventListener('click', ()=> {
    document.getElementById('active-minigame').classList.add('hidden');
    if (arithTimer) clearInterval(arithTimer);
    if (countBallsTimer) clearInterval(countBallsTimer);
    miniGameActive = false;
    openMinigameList();
  });

  // ---------- ОСТАЛЬНОЕ ----------
  function showAuthFields(mode) {
    document.getElementById('auth-fields').classList.remove('hidden');
    document.getElementById('auth-error').textContent = '';
    document.getElementById('auth-nickname').value = '';
    document.getElementById('auth-password').value = '';
    document.getElementById('auth-fields').dataset.mode = mode;
  }
  document.getElementById('btn-register').addEventListener('click', ()=>{ initAudio(); showAuthFields('register'); });
  document.getElementById('btn-login').addEventListener('click', ()=>{ initAudio(); showAuthFields('login'); });
  document.getElementById('auth-submit').addEventListener('click', ()=>{
    initAudio();
    const nick = document.getElementById('auth-nickname').value.trim();
    const pass = document.getElementById('auth-password').value;
    const err = document.getElementById('auth-error');
    if (!nick || !pass) { err.textContent='Заполни поля'; return; }
    const mode = document.getElementById('auth-fields').dataset.mode;
    const key = 'user_'+nick;
    if (mode==='register') {
      if (localStorage.getItem(key)) { err.textContent='Ник занят'; playBeep(200,0.2); return; }
      const newState = { nickname: nick, balance: 0, warehouse: ['bread'], shelves: new Array(6).fill(null),
        maxShelves: 6, permanentBonus: 0, incomeMultiplier: 1, boostersPurchased: [], isCreator: false,
        shopLevel: 0, baseInterval: 2, boosterEndTime: 0 };
      localStorage.setItem(key, JSON.stringify({password: pass, gameState: newState}));
      gameState = {...newState, shelvesTimers: new Array(6).fill(Date.now())};
      saveToStorage(); localStorage.setItem('currentUser', nick); enterGame(); playBeep(660,0.12);
    } else {
      const data = JSON.parse(localStorage.getItem(key)||'{}');
      if (!data.password || data.password!==pass) { err.textContent='Неверный пароль'; playBeep(200,0.2); return; }
      gameState = {...data.gameState}; initShelvesTimers();
      saveToStorage(); localStorage.setItem('currentUser', nick); enterGame(); playBeep(660,0.12);
    }
  });
  function enterGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    startGameLoop(); renderAll(); renderShopUpgrades();
  }
  document.getElementById('btn-logout').addEventListener('click', ()=>{
    const cur = localStorage.getItem('currentUser');
    if (cur) {
      const key = 'user_'+cur;
      const data = JSON.parse(localStorage.getItem(key)||'{}');
      data.gameState = {...gameState}; delete data.gameState.shelvesTimers;
      localStorage.setItem(key, JSON.stringify(data));
    }
    clearInterval(incomeInterval); clearInterval(rentInterval); clearInterval(secondTimer);
    localStorage.removeItem('currentUser');
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
    document.getElementById('auth-fields').classList.add('hidden');
    playBeep(400,0.1);
  });
  document.getElementById('btn-reset').addEventListener('click', ()=>{
    if (confirm('Сбросить весь прогресс?')) {
      localStorage.removeItem('hedgehog_game');
      const cur = localStorage.getItem('currentUser'); if (cur) localStorage.removeItem('user_'+cur);
      location.reload();
    }
  });
  document.getElementById('btn-shop-view').addEventListener('click', ()=>{
    document.getElementById('shop-upgrade-panel').classList.toggle('hidden');
    renderShopUpgrades();
  });
  document.getElementById('btn-close-shop').addEventListener('click', ()=> document.getElementById('shop-upgrade-panel').classList.add('hidden'));
  document.getElementById('promo-apply').addEventListener('click', ()=>{
    if (document.getElementById('promo-input').value.trim()==='m9HYnMq1q42U') {
      gameState.isCreator = true; saveToStorage(); renderAll(); playBeep(880,0.2);
    }
    document.getElementById('promo-input').value = '';
  });

  window.addEventListener('DOMContentLoaded', ()=>{
    const cur = localStorage.getItem('currentUser');
    if (cur) {
      const data = JSON.parse(localStorage.getItem('user_'+cur)||'{}');
      if (data.gameState) { gameState = {...data.gameState}; initShelvesTimers(); enterGame(); return; }
    }
    document.getElementById('auth-fields').classList.add('hidden');
  });
</script>
</body>
</html>
